[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-data-learning"
version = "0.1.0"
description = "FAIR semantic data infrastructure, data science, and MLOps learning project using Materials Project data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn",
    "pymatgen",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "matplotlib",
    "seaborn",
    "mp-api",
    "dvc[s3]",
    "mlflow",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"