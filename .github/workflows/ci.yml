name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (fast, no model artifact required)
        run: python -m pytest tests/ -v --ignore=tests/test_api.py

      - name: Build model via DVC pipeline (models/ is DVC-tracked, absent in checkout)
        run: dvc repro

      - name: API tests (require models/model.pkl)
        run: python -m pytest tests/test_api.py -v

      - name: Verify metrics exist
        run: dvc metrics show