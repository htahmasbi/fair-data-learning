data:
  input: data/processed/mp_oxides_clean.csv
  output_dir: data/processed

train:
  random_state: 42
  cv_folds: 5
  test_size: 0.2
  target: band_gap
  models:
    Ridge:
      alpha: 1.0
    RandomForest:
      n_estimators: 200
    GradientBoost:
      learning_rate: 0.1
      max_iter: 200

features:
  numeric:
    - formation_energy_per_atom
    - density
    - nsites
    - energy_above_hull
    - n_elements
    - avg_electroneg
    - std_electroneg
    - range_electroneg
    - avg_atomic_number
    - total_electrons
    - spacegroup_num
  categorical:
    - crystal_system

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: band_gap_prediction